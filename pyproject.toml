[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squat-analyzer"
version = "0.1.0"
description = "Pose-based squat form analysis with biomechanical feature engineering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0",
    "opencv-python-headless",
    "scikit-learn",
    "joblib",
    "numpy",
    "pandas",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "seaborn"]
app = ["gradio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
